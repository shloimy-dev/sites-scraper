# Per-store: how to resolve product_url from product data (UPC, name).
# Used by resolve_product_urls_dynamic.py and scrape_dims_store.py
#
# Methods:
#   shopify_json  - Fetch /products.json, match by barcode then name
#   search        - Playwright: go to search_url, click first product link
#   crawl         - Playwright: crawl catalog_url, build index, match by name
#   sheet_url     - Product URL already in sheet (e.g. step2 deep_link)
#   skip          - Blocked or no dimensions on site

stores:
  atiko:
    base_url: https://mostlymusic.com
    sheet: Akito
    method: search
    search_url: "{{base}}/search?q={{query}}"
    product_link: "/products/"
    query_from: [upc, name]

  audster:
    base_url: https://audster.com
    sheet: "Audster biz"
    method: shopify_json

  aurora:
    base_url: https://auroragift.com
    sheet: aurora
    method: shopify_json

  bazic:
    base_url: https://www.bazic.com
